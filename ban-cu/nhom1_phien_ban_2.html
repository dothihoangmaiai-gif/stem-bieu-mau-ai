<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PHIẾU MƯỢN SÁCH THƯ VIỆN</title>
</head>
<body>
  <!-- Nhóm 1: THƯ VIỆN SỐ – PHIẾU MƯỢN SÁCH TRỰC TUYẾN -->
  <!-- Phiên bản 2 – đã cải tiến sau thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>PHIẾU MƯỢN SÁCH THƯ VIỆN</h2>
  <form action="ketqua.html" method="get">
    <fieldset>
      <legend>Thông tin người mượn</legend>
    <p><label for="hoten">Họ và tên:</label>
      <input type="text" id="hoten" name="hoten"></p>
    <p><label for="lop">Lớp:</label>
      <select id="lop" name="lop">
        <option value="12A1">12A1</option>
        <option value="12A3">12A3</option>
        <option value="12A8">12A8</option>
        <option value="11A7">11A7</option>
        <option value="11A12">11A12</option>
        <option value="10A1">10A1</option>
      </select></p>
    </fieldset>
    <fieldset>
      <legend>Thông tin sách</legend>
    <p><label for="tensach">Tên sách:</label>
      <input type="text" id="tensach" name="tensach"></p>
    <p>Thể loại:<br>
      <input type="radio" id="theloai1" name="theloai" value="Sách giáo khoa">
      <label for="theloai1">Sách giáo khoa</label><br>
      <input type="radio" id="theloai2" name="theloai" value="Sách tham khảo">
      <label for="theloai2">Sách tham khảo</label><br>
      <input type="radio" id="theloai3" name="theloai" value="Văn học">
      <label for="theloai3">Văn học</label><br>
      <input type="radio" id="theloai4" name="theloai" value="Khoa học – Kĩ thuật">
      <label for="theloai4">Khoa học – Kĩ thuật</label><br>
    </p>
    <p><label for="ngaymuon">Ngày mượn:</label>
      <input type="date" id="ngaymuon" name="ngaymuon"></p>
    <p><label for="ngaytra">Ngày trả (tối đa 14 ngày):</label>
      <input type="date" id="ngaytra" name="ngaytra"></p>
    <p><label for="ghichu">Ghi chú:</label><br>
      <textarea id="ghichu" name="ghichu" rows="4" cols="40"></textarea></p>
    </fieldset>
    <p><input type="submit" value="Gửi phiếu">
    <input type="reset" value="Nhập lại"></p>
  </form>
  <p style="margin-top:24px"><a href="index.html">← Về trang lớp</a></p>
</body>
</html>
