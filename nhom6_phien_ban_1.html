<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KHẢO SÁT THỜI GIAN MÀN HÌNH VÀ GIẤC NGỦ</title>
</head>
<body>
  <!-- Nhóm 6: SỨC KHỎE SỐ – KHẢO SÁT THỜI GIAN SỬ DỤNG THIẾT BỊ SỐ VÀ GIẤC NGỦ -->
  <!-- Phiên bản 1 – bản chế tạo đầu tiên, CÓ LỖI để nhóm phát hiện khi thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>KHẢO SÁT THỜI GIAN MÀN HÌNH VÀ GIẤC NGỦ</h2>
  <form action="ketqua.html" method="get">
    <p><label for="hoten">Họ và tên:</label>
      <input type="text" id="hoten" name="hoten"></p>
    <p><label for="gio">Số giờ dùng điện thoại:</label>
      <input type="text" id="gio" name="gio"></p>
    <p><label for="ngu">Số giờ ngủ:</label>
      <input type="text" id="ngu" name="ngu"></p>
    <p><input type="submit" value="Gửi"></p>
  </form>
  <p style="margin-top:24px"><a href="index.html">← Về trang lớp</a></p>
</body>
</html>
