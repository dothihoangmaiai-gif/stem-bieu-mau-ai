<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PHIẾU MƯỢN SÁCH VÀ KẾ HOẠCH ĐỌC</title>
  <link rel="stylesheet" href="theme.css?v=16">
  <link rel="stylesheet" href="theme-nhom3.css?v=16">
</head>
<body class="nhom3">
  <div class="thanh-cong-cu"><a href="index.html">← Về trang lớp</a><button type="button" onclick="window.print()">🖨 In phiếu</button></div>
  <div class="dau-in">Ngày in: <span id="ngayin"></span></div>
  <!-- Nhóm 3: THƯ VIỆN SỐ – WEB APP MƯỢN SÁCH, LẬP KẾ HOẠCH ĐỌC VÀ THỐNG KÊ LƯỢT MƯỢN -->
  <!-- Phiên bản 1 – bản chế tạo đầu tiên, CÓ LỖI để nhóm phát hiện khi thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>PHIẾU MƯỢN SÁCH VÀ KẾ HOẠCH ĐỌC</h2>
  <form action="ketqua.html" method="get">
    <p><label for="hoten">Họ và tên:</label>
      <input type="text" id="hoten" name="hoten"></p>
    <p><label for="tensach">Tên sách:</label>
      <input type="text" id="tensach" name="tensach"></p>
    <p><label for="ngaytra">Ngày trả:</label>
      <input type="text" id="ngaytra" name="ngaytra"></p>
    <p><input type="submit" value="Gửi phiếu"></p>
  </form>
  <div class="ky"><div>Người lập phiếu<br><br><br>……………………</div><div>Giáo viên xác nhận<br><br><br>……………………</div></div>
  <script>
    document.getElementById("ngayin").textContent = new Date().toLocaleDateString("vi-VN");
    window.addEventListener("beforeprint", function () { document.querySelectorAll("details").forEach(function (d) { d.open = true; }); });
    if (/[?&]print=1/.test(location.search)) window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 500); });
  </script>
  <script src="luu-tru.js?v=16"></script>
  <script src="goi-y-ai.js?v=16"></script>
</body>
</html>
