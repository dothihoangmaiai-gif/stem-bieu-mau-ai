<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PHIẾU MƯỢN SÁCH VÀ KẾ HOẠCH ĐỌC</title>
  <link rel="stylesheet" href="theme.css?v=16">
  <link rel="stylesheet" href="theme-nhom3.css?v=16">
</head>
<body class="nhom3">
  <div class="thanh-cong-cu"><a href="index.html">← Về trang lớp</a><button type="button" onclick="window.print()">🖨 In phiếu</button></div>
  <div class="dau-in">Ngày in: <span id="ngayin"></span></div>
  <!-- Nhóm 3: THƯ VIỆN SỐ – WEB APP MƯỢN SÁCH, LẬP KẾ HOẠCH ĐỌC VÀ THỐNG KÊ LƯỢT MƯỢN -->
  <!-- Phiên bản 2 – đã cải tiến sau thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>PHIẾU MƯỢN SÁCH VÀ KẾ HOẠCH ĐỌC</h2>
  <form action="ketqua.html" method="get">
    <fieldset>
      <legend>Thông tin người mượn</legend>
    <p><label for="mahs">Mã học sinh / tên viết tắt:</label>
      <input type="text" id="mahs" name="mahs"></p>
    <p><label for="lop">Lớp:</label>
      <select id="lop" name="lop">
        <option value="12A1">12A1</option>
        <option value="12A3">12A3</option>
        <option value="12A8">12A8</option>
        <option value="11A7">11A7</option>
        <option value="11A12">11A12</option>
        <option value="10A1">10A1</option>
      </select></p>
    </fieldset>
    <fieldset>
      <legend>Thông tin sách</legend>
    <p><label for="tensach">Tên sách:</label>
      <input type="text" id="tensach" name="tensach"></p>
    <p><label for="tacgia">Tác giả:</label>
      <input type="text" id="tacgia" name="tacgia"></p>
    <p><label for="theloai">Thể loại:</label>
      <select id="theloai" name="theloai">
        <option value="Văn học">Văn học</option>
        <option value="Khoa học tự nhiên">Khoa học tự nhiên</option>
        <option value="Lịch sử – Địa lí">Lịch sử – Địa lí</option>
        <option value="Kĩ năng sống">Kĩ năng sống</option>
        <option value="Sách giáo khoa">Sách giáo khoa</option>
      </select></p>
    <p><label for="sotrang">Số trang:</label>
      <input type="number" id="sotrang" name="sotrang" min="1" max="2000" step="1"></p>
    <p><label for="ngaymuon">Ngày mượn:</label>
      <input type="date" id="ngaymuon" name="ngaymuon"></p>
    </fieldset>
    <p><input type="submit" value="Gửi phiếu">
    <input type="reset" value="Nhập lại"></p>
  </form>
  <div class="ky"><div>Người lập phiếu<br><br><br>……………………</div><div>Giáo viên xác nhận<br><br><br>……………………</div></div>
  <script>
    document.getElementById("ngayin").textContent = new Date().toLocaleDateString("vi-VN");
    window.addEventListener("beforeprint", function () { document.querySelectorAll("details").forEach(function (d) { d.open = true; }); });
    if (/[?&]print=1/.test(location.search)) window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 500); });
  </script>
  <script src="luu-tru.js?v=16"></script>
  <script src="goi-y-ai.js?v=16"></script>
</body>
</html>
