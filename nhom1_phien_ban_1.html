<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PHIẾU KIỂM TRA AN TOÀN Ổ CẮM</title>
</head>
<body>
  <!-- Nhóm 1: Ổ ĐIỆN AN TOÀN – KIỂM TRA QUÁ TẢI Ổ CẮM VÀ ĐIỆN NĂNG LÃNG PHÍ TRONG LỚP HỌC -->
  <!-- Phiên bản 1 – bản chế tạo đầu tiên, CÓ LỖI để nhóm phát hiện khi thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>PHIẾU KIỂM TRA AN TOÀN Ổ CẮM</h2>
  <form action="ketqua.html" method="get">
    <p><label for="phong">Phòng học:</label>
      <input type="text" id="phong" name="phong"></p>
    <p>Thiết bị cắm vào ổ:<br>
      <input type="radio" id="thietbi1" name="thietbi" value="Tivi">
      <label for="thietbi1">Tivi</label><br>
      <input type="radio" id="thietbi2" name="thietbi" value="Loa">
      <label for="thietbi2">Loa</label><br>
      <input type="radio" id="thietbi3" name="thietbi" value="Máy lạnh">
      <label for="thietbi3">Máy lạnh</label><br>
      <input type="radio" id="thietbi4" name="thietbi" value="Quạt trần">
      <label for="thietbi4">Quạt trần</label><br>
    </p>
    <p><label for="congsuat">Công suất:</label>
      <input type="text" id="congsuat" name="congsuat"></p>
    <p><input type="submit" value="Kiểm tra"></p>
  </form>
  <p style="margin-top:24px"><a href="index.html">← Về trang lớp</a></p>
</body>
</html>
