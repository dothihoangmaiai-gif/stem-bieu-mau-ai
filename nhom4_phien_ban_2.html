<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>PHIẾU THEO DÕI MÀN HÌNH VÀ GIẤC NGỦ</title>
  <link rel="stylesheet" href="theme.css?v=15">
  <link rel="stylesheet" href="theme-nhom4.css?v=15">
</head>
<body class="nhom4">
  <div class="thanh-cong-cu"><a href="index.html">← Về trang lớp</a><button type="button" onclick="window.print()">🖨 In phiếu</button></div>
  <div class="dau-in">Ngày in: <span id="ngayin"></span></div>
  <!-- Nhóm 4: MÀN HÌNH VÀ GIẤC NGỦ – THỐNG KÊ THỜI GIAN SỬ DỤNG THIẾT BỊ SỐ VÀ THỜI GIAN NGỦ CỦA HỌC SINH KHỐI 10 -->
  <!-- Phiên bản 2 – đã cải tiến sau thử nghiệm -->
  <!-- Khi thử nghiệm, dữ liệu được gửi bằng GET tới ketqua.html để xem lại.
       Khi triển khai thật: action trỏ tới trang xử lí của máy chủ và dùng method="post". -->
  <h2>PHIẾU THEO DÕI MÀN HÌNH VÀ GIẤC NGỦ</h2>
  <form action="ketqua.html" method="get">
    <fieldset>
      <legend>Thông tin chung (ẩn danh)</legend>
    <p>Khối:<br>
      <input type="radio" id="khoi1" name="khoi" value="10">
      <label for="khoi1">10</label><br>
      <input type="radio" id="khoi2" name="khoi" value="11">
      <label for="khoi2">11</label><br>
      <input type="radio" id="khoi3" name="khoi" value="12">
      <label for="khoi3">12</label><br>
    </p>
    </fieldset>
    <fieldset>
      <legend>Thiết bị số</legend>
    <p><label for="manhinh">Thời gian màn hình trung bình 7 ngày (giờ/ngày, đọc trong điện thoại):</label>
      <input type="number" id="manhinh" name="manhinh" min="0" max="24" step="0.1"></p>
    <p>Mục đích sử dụng:<br>
      <input type="checkbox" id="mucdich1" name="mucdich" value="Học tập">
      <label for="mucdich1">Học tập</label><br>
      <input type="checkbox" id="mucdich2" name="mucdich" value="Mạng xã hội">
      <label for="mucdich2">Mạng xã hội</label><br>
      <input type="checkbox" id="mucdich3" name="mucdich" value="Chơi game">
      <label for="mucdich3">Chơi game</label><br>
      <input type="checkbox" id="mucdich4" name="mucdich" value="Xem video">
      <label for="mucdich4">Xem video</label><br>
      <input type="checkbox" id="mucdich5" name="mucdich" value="Nhắn tin">
      <label for="mucdich5">Nhắn tin</label><br>
    </p>
    </fieldset>
    <fieldset>
      <legend>Giấc ngủ</legend>
    <p><label for="giongu">Giờ đi ngủ thường ngày:</label>
      <input type="time" id="giongu" name="giongu"></p>
    <p><label for="giothuc">Giờ thức dậy thường ngày:</label>
      <input type="time" id="giothuc" name="giothuc"></p>
    <p>Dùng điện thoại trong 30 phút trước khi ngủ?:<br>
      <input type="radio" id="truocngu1" name="truocngu" value="Có">
      <label for="truocngu1">Có</label><br>
      <input type="radio" id="truocngu2" name="truocngu" value="Không">
      <label for="truocngu2">Không</label><br>
    </p>
    <p><label for="mongmuon">Em muốn được hỗ trợ gì?:</label><br>
      <textarea id="mongmuon" name="mongmuon" rows="4" cols="40"></textarea></p>
    </fieldset>
    <p><input type="submit" value="Gửi phiếu">
    <input type="reset" value="Nhập lại"></p>
  </form>
  <div class="ky"><div>Giáo viên xác nhận<br><br><br>……………………</div></div>
  <script>
    document.getElementById("ngayin").textContent = new Date().toLocaleDateString("vi-VN");
    window.addEventListener("beforeprint", function () { document.querySelectorAll("details").forEach(function (d) { d.open = true; }); });
    if (/[?&]print=1/.test(location.search)) window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 500); });
  </script>
  <script src="luu-tru.js?v=15"></script>
  <script src="goi-y-ai.js?v=15"></script>
</body>
</html>
